name: Build TEST MITRA Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND ZIP
      # ==========================================
      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 3. EXTRACT ZIP
      # ==========================================
      - name: Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -o "$ZIP_FILE" -d extracted_project

          echo "ZIP extracted successfully."


      # ==========================================
      # 4. DETECT ANDROID PROJECT
      # ==========================================
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          FOUND_GRADLEW=$(find extracted_project \
            -type f \
            -name "gradlew" \
            | head -n 1)

          if [ -n "$FOUND_GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$FOUND_GRADLEW")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND_SETTINGS=$(find extracted_project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FOUND_BUILD=$(find extracted_project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$FOUND_BUILD" ]; then
              PROJECT_DIR=$(dirname "$FOUND_BUILD")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID PROJECT: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 5. JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==========================================
      # 6. PREPARE GRADLE
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x ./gradlew

          mkdir -p gradle/wrapper

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#g' \
              gradle/wrapper/gradle-wrapper.properties
          else
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x ./gradlew


      # ==========================================
      # 7. DEBUG KEYSTORE
      # ==========================================
      - name: Prepare Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p app

          if [ ! -f "app/debug.keystore" ]; then
            cp debug.keystore app/debug.keystore
          fi


      # ==========================================
      # 8. ENV FILES
      # ==========================================
      - name: Prepare Environment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch .env
          touch .env.example


      # ==========================================
      # 9. GOOGLE SERVICES CHECK
      # ==========================================
      - name: Check Google Services
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "app/google-services.json" ]; then
            echo "google-services.json found."
          else
            echo "google-services.json not required."
          fi


      # ==========================================
      # 10. CLEAN
      # ==========================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build TEST MITRA APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "=========================================="
          echo "BUILDING TEST MITRA APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================
      # 12. CHECK APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK NOT GENERATED."
            exit 1
          fi


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


      # ==========================================
      # 14. SUCCESS
      # ==========================================
      - name: Build Complete
        if: success()
        run: |
          echo "=========================================="
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "GitHub:"
          echo "Actions -> Latest Run -> Artifacts"
          echo "-> TEST-MITRA-Debug-APK"
